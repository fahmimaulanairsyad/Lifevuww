<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_tortoise" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1c202a"/>
      <stop offset="100%" stop-color="#141417"/>
    </radialGradient>
    <linearGradient id="amberGold_tortoise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#e09f3e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="aegisIndigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <!-- Base Shield -->
  <rect width="256" height="256" rx="28" fill="url(#bgGlow_tortoise)"/>
  <rect x="6" y="6" width="244" height="244" rx="22" fill="none" stroke="#2a2a30" stroke-width="2"/>
  <rect x="12" y="12" width="232" height="232" rx="18" fill="none" stroke="url(#amberGold_tortoise)" stroke-width="1.2" opacity="0.45"/>

  <!-- Bastion Shield Outer Ring -->
  <circle cx="128" cy="128" r="66" fill="none" stroke="url(#aegisIndigo)" stroke-width="2" stroke-dasharray="12 4" opacity="0.7"/>

  <!-- Ancient Tortoise Head & Armored Neck -->
  <path d="M114 54 C114 42 122 36 128 36 C134 36 142 42 142 54 L144 80 L112 80 Z" fill="url(#amberGold_tortoise)" stroke="#2a2a30" stroke-width="1.2"/>
  <circle cx="120" cy="50" r="2.5" fill="#101014"/>
  <circle cx="136" cy="50" r="2.5" fill="#101014"/>

  <!-- Flippers / Bastion Claws -->
  <!-- Left Flipper -->
  <polygon points="86,96 34,74 46,118 84,122" fill="url(#aegisIndigo)" stroke="#2a2a30" stroke-width="1.2"/>
  <polygon points="82,160 38,184 56,212 90,182" fill="url(#aegisIndigo)" stroke="#2a2a30" stroke-width="1.2"/>
  <!-- Right Flipper -->
  <polygon points="170,96 222,74 210,118 172,122" fill="url(#aegisIndigo)" stroke="#2a2a30" stroke-width="1.2"/>
  <polygon points="174,160 218,184 200,212 166,182" fill="url(#aegisIndigo)" stroke="#2a2a30" stroke-width="1.2"/>

  <!-- Fortress Carapace Shell (Hexagonal Bastion) -->
  <path d="M80 94 L176 94 L204 142 L176 198 L80 198 L52 142 Z" fill="#181922" stroke="#2a2a30" stroke-width="2"/>

  <!-- Central Hexagonal Bastion Plates -->
  <!-- Center Hexagon -->
  <polygon points="128,114 150,126 150,152 128,164 106,152 106,126" fill="url(#amberGold_tortoise)" stroke="#2a2a30" stroke-width="1.5"/>
  <circle cx="128" cy="139" r="6" fill="#101014"/>
  <circle cx="128" cy="139" r="3" fill="#818cf8"/>

  <!-- Surrounding Scutes -->
  <!-- Top Plate -->
  <polygon points="112,84 144,84 150,110 128,112 106,110" fill="url(#aegisIndigo)"/>
  <!-- Bottom Plate -->
  <polygon points="106,168 128,166 150,168 144,194 112,194" fill="url(#aegisIndigo)"/>
  <!-- Left Scutes -->
  <polygon points="76,112 102,118 102,142 66,138" fill="url(#aegisIndigo)"/>
  <polygon points="66,144 102,148 98,174 72,168" fill="url(#aegisIndigo)"/>
  <!-- Right Scutes -->
  <polygon points="180,112 154,118 154,142 190,138" fill="url(#aegisIndigo)"/>
  <polygon points="190,144 154,148 158,174 184,168" fill="url(#aegisIndigo)"/>

  <!-- Runic Tail -->
  <polygon points="128,200 132,224 128,232 124,224" fill="url(#amberGold_tortoise)"/>
</svg>
