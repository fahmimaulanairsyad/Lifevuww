<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_owl" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#182430"/>
      <stop offset="100%" stop-color="#141417"/>
    </radialGradient>
    <linearGradient id="amberGold_owl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#e09f3e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="starlightCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Base Shield -->
  <rect width="256" height="256" rx="28" fill="url(#bgGlow_owl)"/>
  <rect x="6" y="6" width="244" height="244" rx="22" fill="none" stroke="#2a2a30" stroke-width="2"/>
  <rect x="12" y="12" width="232" height="232" rx="18" fill="none" stroke="url(#amberGold_owl)" stroke-width="1.2" opacity="0.45"/>

  <!-- Clockwork Astrolabe Ring -->
  <circle cx="128" cy="120" r="66" fill="none" stroke="url(#starlightCyan)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="128" cy="120" r="58" fill="none" stroke="url(#amberGold_owl)" stroke-width="1" opacity="0.35"/>

  <!-- Spread Feather Wings -->
  <!-- Left Wing -->
  <g fill="url(#amberGold_owl)">
    <polygon points="110,104 60,68 84,106"/>
    <polygon points="104,116 46,92 78,124"/>
    <polygon points="102,130 38,122 76,144"/>
    <polygon points="104,146 44,156 82,166"/>
  </g>
  <!-- Right Wing -->
  <g fill="url(#amberGold_owl)">
    <polygon points="146,104 196,68 172,106"/>
    <polygon points="152,116 210,92 178,124"/>
    <polygon points="154,130 218,122 180,144"/>
    <polygon points="152,146 212,156 174,166"/>
  </g>

  <!-- Horned Ear Tufts -->
  <polygon points="106,86 86,48 116,68" fill="url(#starlightCyan)"/>
  <polygon points="150,86 170,48 140,68" fill="url(#starlightCyan)"/>

  <!-- Owl Head Crest & Facial Disks -->
  <path d="M100 86 L156 86 L164 126 L128 146 L92 126 Z" fill="#181a24" stroke="#2a2a30" stroke-width="1.5"/>

  <!-- Piercing Geometric Eyes -->
  <circle cx="112" cy="106" r="14" fill="#101014" stroke="url(#amberGold_owl)" stroke-width="2"/>
  <circle cx="144" cy="106" r="14" fill="#101014" stroke="url(#amberGold_owl)" stroke-width="2"/>
  <!-- Glowing Iris & Astrolabe Pointer -->
  <circle cx="112" cy="106" r="7" fill="url(#starlightCyan)"/>
  <circle cx="144" cy="106" r="7" fill="url(#starlightCyan)"/>
  <circle cx="112" cy="106" r="2.5" fill="#fcd34d"/>
  <circle cx="144" cy="106" r="2.5" fill="#fcd34d"/>

  <!-- Curved Hooked Beak -->
  <polygon points="124,112 132,112 128,138" fill="url(#amberGold_owl)"/>

  <!-- Body Plumage / Hourglass Emblem in Chest -->
  <path d="M108 148 L148 148 L154 196 L128 226 L102 196 Z" fill="#151720" stroke="#2a2a30" stroke-width="1.5"/>

  <!-- Cosmic Hourglass Vector -->
  <polygon points="120,162 136,162 128,176" fill="url(#starlightCyan)"/>
  <polygon points="128,176 136,190 120,190" fill="url(#amberGold_owl)"/>
  <circle cx="128" cy="176" r="3" fill="#fcd34d"/>
</svg>
