<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_wolf" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1e2624"/>
      <stop offset="100%" stop-color="#141417"/>
    </radialGradient>
    <linearGradient id="amberGold_wolf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#e09f3e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <!-- Base Shield -->
  <rect width="256" height="256" rx="28" fill="url(#bgGlow_wolf)"/>
  <rect x="6" y="6" width="244" height="244" rx="22" fill="none" stroke="#2a2a30" stroke-width="2"/>
  <rect x="12" y="12" width="232" height="232" rx="18" fill="none" stroke="url(#amberGold_wolf)" stroke-width="1.2" opacity="0.45"/>

  <!-- Lunar Crescent Backing -->
  <path d="M168 56 C144 56 122 72 116 96 C134 94 156 102 166 118 C176 134 172 156 160 170 C184 162 200 138 200 112 C200 81 185 56 168 56 Z" fill="url(#amberGold_wolf)" opacity="0.35"/>

  <!-- Dire Wolf Head Silhouette (Profile / 3/4 Woodcut) -->
  <!-- Ears -->
  <polygon points="134,54 116,92 144,82" fill="url(#emeraldTeal)"/>
  <polygon points="166,48 146,86 174,78" fill="url(#amberGold_wolf)"/>
  <polygon points="162,56 150,82 170,76" fill="#141417"/>

  <!-- Cranium & Brow -->
  <path d="M174 78 L142 84 L110 94 L82 124 L60 134 L38 138 L62 148 L86 148 L104 158 L126 152 L146 174 L170 156 L194 136 L184 100 Z" fill="#181a20" stroke="#2a2a30" stroke-width="2"/>

  <!-- Snout & Feral Fangs -->
  <path d="M82 124 L38 138 L58 148 L84 148 Z" fill="url(#amberGold_wolf)"/>
  <!-- Upper & Lower Fangs -->
  <polygon points="62,146 66,158 72,146" fill="#fcd34d"/>
  <polygon points="76,146 80,154 84,146" fill="#fcd34d"/>
  <polygon points="70,162 74,152 78,162" fill="#fcd34d"/>

  <!-- Glowing Wolf Eye -->
  <polygon points="112,112 128,106 124,116 110,118" fill="url(#emeraldTeal)"/>
  <circle cx="118" cy="112" r="2.2" fill="#ffffff"/>

  <!-- Mane Spikes / Fur Tufts -->
  <g fill="url(#amberGold_wolf)">
    <polygon points="126,152 110,184 136,170"/>
    <polygon points="144,170 132,204 156,186"/>
    <polygon points="166,160 156,224 184,196"/>
    <polygon points="188,142 188,212 208,172"/>
  </g>

  <!-- Runic Chest Mark -->
  <polygon points="146,186 160,202 146,218 132,202" fill="url(#emeraldTeal)"/>
  <circle cx="146" cy="202" r="3" fill="#fcd34d"/>
</svg>
