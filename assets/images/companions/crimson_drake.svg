<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_drake" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2e1922"/>
      <stop offset="100%" stop-color="#141417"/>
    </radialGradient>
    <linearGradient id="amberGold_drake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#e09f3e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="crimsonRed_drake" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- Base Shield -->
  <rect width="256" height="256" rx="28" fill="url(#bgGlow_drake)"/>
  <rect x="6" y="6" width="244" height="244" rx="22" fill="none" stroke="#2a2a30" stroke-width="2"/>
  <rect x="12" y="12" width="232" height="232" rx="18" fill="none" stroke="url(#amberGold_drake)" stroke-width="1.2" opacity="0.45"/>

  <!-- Barbed Drake Wings -->
  <!-- Left Wing Struts & Webbing -->
  <path d="M112 110 C86 70 52 58 24 70 C42 88 56 112 60 144 C82 128 100 120 112 110 Z" fill="url(#crimsonRed_drake)" stroke="#2a2a30" stroke-width="1"/>
  <polygon points="52,60 24,70 48,82" fill="url(#amberGold_drake)"/>
  <!-- Right Wing Struts & Webbing -->
  <path d="M144 110 C170 70 204 58 232 70 C214 88 200 112 196 144 C174 128 156 120 144 110 Z" fill="url(#crimsonRed_drake)" stroke="#2a2a30" stroke-width="1"/>
  <polygon points="204,60 232,70 208,82" fill="url(#amberGold_drake)"/>

  <!-- Drake Great Horns -->
  <path d="M106 82 C88 54 62 44 46 48 C48 64 66 84 94 92 Z" fill="url(#amberGold_drake)"/>
  <path d="M150 82 C168 54 194 44 210 48 C208 64 190 84 162 92 Z" fill="url(#amberGold_drake)"/>

  <!-- Crest & Brow -->
  <polygon points="128,58 144,78 138,98 118,98 112,78" fill="url(#crimsonRed_drake)"/>
  <!-- Snout & Jaw -->
  <polygon points="112,98 144,98 150,132 128,146 106,132" fill="#1b171c" stroke="#2a2a30" stroke-width="1.5"/>

  <!-- Glowing Ember Eyes -->
  <polygon points="114,104 124,108 118,116 110,112" fill="url(#amberGold_drake)"/>
  <polygon points="142,104 132,108 138,116 146,112" fill="url(#amberGold_drake)"/>
  <circle cx="118" cy="110" r="2" fill="#ffffff"/>
  <circle cx="138" cy="110" r="2" fill="#ffffff"/>

  <!-- Nostril Embers -->
  <circle cx="122" cy="132" r="2" fill="#dc2626"/>
  <circle cx="134" cy="132" r="2" fill="#dc2626"/>

  <!-- Scaled Neck & Plated Scales -->
  <path d="M106 142 L150 142 L160 188 L128 226 L96 188 Z" fill="#151419" stroke="#2a2a30" stroke-width="1.5"/>

  <!-- Dragon Scale Armor Ridge -->
  <g fill="url(#amberGold_drake)">
    <polygon points="128,148 136,160 128,168 120,160"/>
    <polygon points="128,172 138,186 128,196 118,186"/>
    <polygon points="128,200 134,212 128,220 122,212"/>
  </g>

  <!-- Side Spikes -->
  <polygon points="98,154 84,166 100,172" fill="url(#crimsonRed_drake)"/>
  <polygon points="158,154 172,166 156,172" fill="url(#crimsonRed_drake)"/>
</svg>
