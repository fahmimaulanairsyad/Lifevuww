<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_griffin" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2a2218"/>
      <stop offset="100%" stop-color="#141417"/>
    </radialGradient>
    <linearGradient id="amberGold_griffin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#e09f3e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="royalAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Base Shield -->
  <rect width="256" height="256" rx="28" fill="url(#bgGlow_griffin)"/>
  <rect x="6" y="6" width="244" height="244" rx="22" fill="none" stroke="#2a2a30" stroke-width="2"/>
  <rect x="12" y="12" width="232" height="232" rx="18" fill="none" stroke="url(#amberGold_griffin)" stroke-width="1.2" opacity="0.45"/>

  <!-- Imperial Sun Halo -->
  <circle cx="128" cy="116" r="64" fill="none" stroke="url(#amberGold_griffin)" stroke-width="1.8" stroke-dasharray="10 4" opacity="0.6"/>

  <!-- Sovereign Griffin Crown -->
  <polygon points="112,50 118,34 128,44 138,34 144,50" fill="url(#amberGold_griffin)" stroke="#2a2a30" stroke-width="1"/>
  <circle cx="128" cy="40" r="2.5" fill="#fcd34d"/>

  <!-- Griffin Raptor Head Silhouette (Facing Left/Profile) -->
  <path d="M148 60 C128 60 106 72 90 92 L62 108 C50 116 46 128 54 134 C64 138 78 136 94 122 L98 134 C94 148 106 156 122 152 L140 178 L168 166 L154 142 L180 120 L166 84 Z" fill="#18181f" stroke="#2a2a30" stroke-width="2"/>

  <!-- Raptor Hooked Beak -->
  <path d="M90 92 L62 108 C48 116 44 128 54 134 C62 138 74 134 86 122 L92 110 Z" fill="url(#amberGold_griffin)" stroke="#2a2a30" stroke-width="1.2"/>
  <polygon points="68,114 86,112 80,124" fill="#141417"/>

  <!-- Piercing Raptor Eye -->
  <circle cx="106" cy="94" r="6" fill="#101014" stroke="url(#amberGold_griffin)" stroke-width="1.5"/>
  <circle cx="106" cy="94" r="3" fill="#fcd34d"/>
  <circle cx="107" cy="93" r="1" fill="#ffffff"/>

  <!-- Feathered Lion Mane & Plumage Spikes -->
  <g fill="url(#royalAmber)">
    <polygon points="144,72 178,64 158,94"/>
    <polygon points="160,94 196,92 168,122"/>
    <polygon points="168,122 208,126 172,154"/>
    <polygon points="166,154 198,168 156,182"/>
    <polygon points="152,182 178,212 136,204"/>
  </g>

  <!-- Imperial Chest Sigil -->
  <path d="M112 162 L150 162 L156 208 L128 230 L100 208 Z" fill="#15151c" stroke="#2a2a30" stroke-width="1.5"/>
  <polygon points="128,172 140,188 128,206 116,188" fill="url(#amberGold_griffin)"/>
  <circle cx="128" cy="188" r="3" fill="#fcd34d"/>
</svg>
