  <path d="M82 112 C82 86 102 78 128 78 C154 78 174 86 174 112 C172 138 184 178 190 216 L66 216 C72 178 84 138 82 112 Z" fill="#101014"/>

  <!-- Skull Face in Dark Depth -->
  <!-- Cranium -->
