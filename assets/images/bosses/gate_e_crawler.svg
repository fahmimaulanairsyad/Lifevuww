<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_crawler" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1a1f"/>
      <stop offset="100%" stop-color="#141417"/>
    </radialGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#e09f3e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="crimsonRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- Shield Base -->
  <rect width="256" height="256" rx="28" fill="url(#bgGlow_crawler)"/>
  <rect x="6" y="6" width="244" height="244" rx="22" fill="none" stroke="#2a2a30" stroke-width="2"/>
  <rect x="12" y="12" width="232" height="232" rx="18" fill="none" stroke="url(#amberGold)" stroke-width="1.2" opacity="0.45"/>

  <!-- Ornate Corner Marks -->
  <path d="M20 36 L36 20 L48 20 L20 48 Z M236 36 L220 20 L208 20 L236 48 Z M20 220 L36 236 L48 236 L20 208 Z M236 220 L220 236 L208 236 L236 208 Z" fill="url(#amberGold)" opacity="0.4"/>

  <!-- Gate E Rank Emblem Banner -->
  <path d="M84 22 L172 22 L164 38 L92 38 Z" fill="#1f1f24" stroke="#2a2a30" stroke-width="1"/>
  <text x="128" y="34" fill="url(#amberGold)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">GATE-E // BEAST</text>

  <!-- Crawler Silhouette & Chitin Armour -->
  <g transform="translate(0, 10)">
    <!-- Mandibles / Horns -->
    <path d="M88 82 C72 58 54 52 42 60 C38 64 42 76 56 82 C74 90 84 104 88 116 Z" fill="url(#crimsonRed)"/>
    <path d="M168 82 C184 58 202 52 214 60 C218 64 214 76 200 82 C182 90 172 104 168 116 Z" fill="url(#crimsonRed)"/>

    <!-- Sharp Legs (Left) -->
    <path d="M82 120 C56 112 36 122 24 144 C34 140 52 134 76 134 Z" fill="url(#amberGold)"/>
    <path d="M78 142 C50 142 32 158 22 184 C32 176 52 166 74 158 Z" fill="url(#amberGold)"/>
    <path d="M82 168 C58 174 44 196 38 222 C46 210 64 194 84 180 Z" fill="url(#amberGold)"/>

    <!-- Sharp Legs (Right) -->
    <path d="M174 120 C200 112 220 122 232 144 C222 140 204 134 180 134 Z" fill="url(#amberGold)"/>
    <path d="M178 142 C206 142 224 158 234 184 C224 176 204 166 182 158 Z" fill="url(#amberGold)"/>
    <path d="M174 168 C198 174 212 196 218 222 C210 210 192 194 172 180 Z" fill="url(#amberGold)"/>

    <!-- Segmented Chitin Carapace (Top to Bottom) -->
    <!-- Head Plating -->
    <polygon points="128,68 152,86 142,106 114,106 104,86" fill="url(#amberGold)"/>
    <polygon points="128,76 142,90 136,100 120,100 114,90" fill="#141417"/>

    <!-- Glowing Eyes -->
    <circle cx="120" cy="94" r="3" fill="#dc2626"/>
    <circle cx="136" cy="94" r="3" fill="#dc2626"/>

    <!-- Segment 1: Thorax -->
    <path d="M96 108 L160 108 L170 126 L128 134 L86 126 Z" fill="url(#crimsonRed)" stroke="#2a2a30" stroke-width="1.5"/>
    <path d="M106 112 L150 112 L156 122 L128 128 L100 122 Z" fill="#141417" opacity="0.6"/>

    <!-- Segment 2: Dorsal Shield -->
    <path d="M90 130 L166 130 L176 150 L128 160 L80 150 Z" fill="url(#amberGold)" stroke="#2a2a30" stroke-width="1.5"/>
    <path d="M102 134 L154 134 L160 146 L128 154 L96 146 Z" fill="#141417" opacity="0.6"/>

    <!-- Segment 3: Carapace -->
    <path d="M88 154 L168 154 L172 176 L128 186 L84 176 Z" fill="url(#crimsonRed)" stroke="#2a2a30" stroke-width="1.5"/>
    <path d="M100 158 L156 158 L158 170 L128 178 L98 170 Z" fill="#141417" opacity="0.6"/>

    <!-- Segment 4: Abdomen End Spikes -->
    <path d="M96 180 L160 180 L156 202 L128 220 L100 202 Z" fill="url(#amberGold)" stroke="#2a2a30" stroke-width="1.5"/>
    <polygon points="128,190 144,204 128,214 112,204" fill="#141417"/>
    <!-- Stinger tip -->
    <polygon points="128,212 132,228 128,236 124,228" fill="url(#crimsonRed)"/>
  </g>
</svg>
