<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_mantle" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2a201c"/>
      <stop offset="100%" stop-color="#141417"/>
    </radialGradient>
    <linearGradient id="amberGold_m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#e09f3e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="crimsonRed_m" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- Base Shield -->
  <rect width="256" height="256" rx="28" fill="url(#bgGlow_mantle)"/>
  <rect x="6" y="6" width="244" height="244" rx="22" fill="none" stroke="#2a2a30" stroke-width="2"/>
  <rect x="12" y="12" width="232" height="232" rx="18" fill="none" stroke="url(#amberGold_m)" stroke-width="1.2" opacity="0.45"/>

  <!-- Flowing Velvet Cape Behind Armor -->
  <path d="M68 86 C48 120 40 180 34 220 L76 220 C82 178 92 136 102 96 Z" fill="url(#crimsonRed_m)" opacity="0.85"/>
  <path d="M188 86 C208 120 216 180 222 220 L180 220 C174 178 164 136 154 96 Z" fill="url(#crimsonRed_m)" opacity="0.85"/>

  <!-- Spiked Imperial Pauldrons (Left & Right Shoulders) -->
  <!-- Left Pauldron -->
  <g fill="url(#amberGold_m)" stroke="#2a2a30" stroke-width="1.5">
    <polygon points="46,74 86,58 98,90 48,110"/>
    <polygon points="38,102 78,88 92,120 42,136"/>
    <polygon points="34,128 72,118 84,148 38,158"/>
  </g>
  <!-- Right Pauldron -->
  <g fill="url(#amberGold_m)" stroke="#2a2a30" stroke-width="1.5">
    <polygon points="210,74 170,58 158,90 208,110"/>
    <polygon points="218,102 178,88 164,120 214,136"/>
    <polygon points="222,128 184,118 172,148 218,158"/>
  </g>

  <!-- Neck Guard / Gorget -->
  <path d="M106 62 C116 52 140 52 150 62 L164 88 L92 88 Z" fill="#18181f" stroke="#2a2a30" stroke-width="1.5"/>
  <polygon points="128,54 138,68 128,78 118,68" fill="url(#amberGold_m)"/>

  <!-- Cuirass Chestplate (Sovereign Dragon / Lion Crest) -->
  <path d="M88 90 L168 90 L180 148 L128 206 L76 148 Z" fill="#16171f" stroke="#2a2a30" stroke-width="2"/>

  <!-- Golden Pectoral Trim -->
  <path d="M96 98 L160 98 L170 140 L128 190 L86 140 Z" fill="#1b1c24" stroke="url(#amberGold_m)" stroke-width="1.5"/>

  <!-- Imperial Lion / Aegis Shield Emblem on Breastplate -->
  <polygon points="128,110 148,124 142,156 128,172 114,156 108,124" fill="url(#amberGold_m)"/>
  <polygon points="128,120 140,130 136,150 128,162 120,150 116,130" fill="#141417"/>
  <!-- Ruby Crest Core -->
  <polygon points="128,130 134,140 128,150 122,140" fill="url(#crimsonRed_m)"/>

  <!-- Fauld / Tassets Armor Plating (Bottom Belt) -->
  <polygon points="102,204 154,204 146,234 128,240 110,234" fill="url(#amberGold_m)" stroke="#2a2a30" stroke-width="1.5"/>
  <line x1="128" y1="204" x2="128" y2="240" stroke="#121216" stroke-width="2"/>
</svg>
