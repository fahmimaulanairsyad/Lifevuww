<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_blade" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#282218"/>
      <stop offset="100%" stop-color="#141417"/>
    </radialGradient>
    <linearGradient id="amberGold_blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#e09f3e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="chronoCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>

  <!-- Base Shield -->
  <rect width="256" height="256" rx="28" fill="url(#bgGlow_blade)"/>
  <rect x="6" y="6" width="244" height="244" rx="22" fill="none" stroke="#2a2a30" stroke-width="2"/>
  <rect x="12" y="12" width="232" height="232" rx="18" fill="none" stroke="url(#amberGold_blade)" stroke-width="1.2" opacity="0.45"/>

  <!-- Rotating Chrono Time Dial Ring -->
  <circle cx="128" cy="128" r="68" fill="none" stroke="url(#chronoCyan)" stroke-width="1.8" stroke-dasharray="12 4" opacity="0.6"/>
  <circle cx="128" cy="128" r="54" fill="none" stroke="url(#amberGold_blade)" stroke-width="1" opacity="0.3"/>

  <!-- Chrono Blade (Diagonal Greatsword: top-right to bottom-left) -->
  <g transform="rotate(-45 128 128)">
    <!-- Blade Tip & Edges -->
    <polygon points="128,32 138,56 136,152 128,158 120,152 118,56" fill="#18181f" stroke="#2a2a30" stroke-width="1.5"/>
    <!-- Blade Bevel Highlight -->
    <polygon points="128,34 135,56 128,154" fill="url(#amberGold_blade)"/>
    <polygon points="128,34 121,56 128,154" fill="#121216"/>

    <!-- Central Temporal Energy Fuller -->
    <line x1="128" y1="52" x2="128" y2="146" stroke="url(#chronoCyan)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="128" cy="74" r="2.5" fill="#fcd34d"/>
    <circle cx="128" cy="100" r="2.5" fill="#fcd34d"/>
    <circle cx="128" cy="126" r="2.5" fill="#fcd34d"/>

    <!-- Ornate Clockwork Crossguard -->
    <path d="M96 156 L160 156 L154 168 L138 166 L128 174 L118 166 L102 168 Z" fill="url(#amberGold_blade)" stroke="#2a2a30" stroke-width="1.5"/>
    <circle cx="128" cy="164" r="5" fill="#141417" stroke="url(#chronoCyan)" stroke-width="1.5"/>
    <circle cx="128" cy="164" r="2" fill="#fcd34d"/>

    <!-- Grip / Hilt Wrap -->
    <rect x="124" y="174" width="8" height="34" rx="2" fill="#24242d" stroke="#2a2a30" stroke-width="1"/>
    <line x1="124" y1="182" x2="132" y2="182" stroke="url(#amberGold_blade)" stroke-width="1"/>
    <line x1="124" y1="190" x2="132" y2="190" stroke="url(#amberGold_blade)" stroke-width="1"/>
    <line x1="124" y1="198" x2="132" y2="198" stroke="url(#amberGold_blade)" stroke-width="1"/>

    <!-- Pommel & Counterweight Clock Cog -->
    <polygon points="128,210 138,222 128,230 118,222" fill="url(#amberGold_blade)" stroke="#2a2a30" stroke-width="1.5"/>
    <circle cx="128" cy="221" r="3" fill="#06b6d4"/>
  </g>
</svg>
