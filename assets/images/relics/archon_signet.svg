<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_signet" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2d2216"/>
      <stop offset="100%" stop-color="#141417"/>
    </radialGradient>
    <linearGradient id="amberGold_ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="crimsonGem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- Base Shield -->
  <rect width="256" height="256" rx="28" fill="url(#bgGlow_signet)"/>
  <rect x="6" y="6" width="244" height="244" rx="22" fill="none" stroke="#2a2a30" stroke-width="2"/>
  <rect x="12" y="12" width="232" height="232" rx="18" fill="none" stroke="url(#amberGold_ring)" stroke-width="1.2" opacity="0.45"/>

  <!-- Radiating Solar Halo Rays -->
  <circle cx="128" cy="116" r="66" fill="none" stroke="url(#amberGold_ring)" stroke-width="1.8" stroke-dasharray="10 5" opacity="0.5"/>

  <!-- Thick Imperial Ring Band (Lower Loop) -->
  <path d="M78 126 C78 178 100 216 128 216 C156 216 178 178 178 126 L154 126 C154 164 142 192 128 192 C114 192 102 164 102 126 Z" fill="url(#amberGold_ring)" stroke="#2a2a30" stroke-width="1.5"/>
  <path d="M88 140 C88 170 104 196 128 196 C152 196 168 170 168 140" fill="none" stroke="#2a2a30" stroke-width="1.5"/>

  <!-- Signet Bezel Shoulders -->
  <polygon points="76,128 66,92 102,82 100,126" fill="url(#amberGold_ring)" stroke="#2a2a30" stroke-width="1.5"/>
  <polygon points="180,128 190,92 154,82 156,126" fill="url(#amberGold_ring)" stroke="#2a2a30" stroke-width="1.5"/>

  <!-- Octagonal Signet Seal Face -->
  <polygon points="98,62 158,62 184,88 184,136 158,162 98,162 72,136 72,88" fill="#1b171c" stroke="url(#amberGold_ring)" stroke-width="3"/>
  <polygon points="102,68 154,68 176,92 176,132 154,156 102,156 80,132 80,92" fill="#121216"/>

  <!-- Central Archon Solar Emblem Engraving -->
  <!-- Outer Solar Diamond -->
  <polygon points="128,82 154,112 128,142 102,112" fill="url(#crimsonGem)" stroke="url(#amberGold_ring)" stroke-width="1.5"/>
  <!-- Inner Gold Sun Cog -->
  <circle cx="128" cy="112" r="14" fill="url(#amberGold_ring)"/>
  <circle cx="128" cy="112" r="8" fill="#121216"/>
  <circle cx="128" cy="112" r="4" fill="#fef08a"/>

  <!-- 4 Corner Rune Dots -->
  <circle cx="92" cy="80" r="3" fill="url(#amberGold_ring)"/>
  <circle cx="164" cy="80" r="3" fill="url(#amberGold_ring)"/>
  <circle cx="92" cy="144" r="3" fill="url(#amberGold_ring)"/>
  <circle cx="164" cy="144" r="3" fill="url(#amberGold_ring)"/>
</svg>
