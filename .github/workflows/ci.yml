name: Lifevuww CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo, pdo_mysql, json
          coverage: none

      - name: PHP Syntax Check (Lint)
        run: |
          find . -type f -name "*.php" ! -path "./vendor/*" -print0 | while IFS= read -r -d '' file; do
            php -l "$file" || exit 1
          done

      - name: Run Lifevuww Test Suite
        run: |
          php tests/run_tests.php
